<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#002b49">
  <meta name="description" content="TUI BLUE Palm Garden İSG Saha Gözlem Portalı">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="İSG Portalı">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>İSG Saha Gözlem Portalı</title>
  <style>
    *{box-sizing:border-box}
    html,body{
      margin:0;width:100%;height:100%;overflow:hidden;
      background:#f2f7fa;
      font-family:Arial,Helvetica,sans-serif
    }

    #appFrame{
      display:block;
      width:100%;
      height:100dvh;
      border:0;
      background:#fff
    }

    #loading{
      position:fixed;
      inset:0;
      z-index:10;
      display:grid;
      place-items:center;
      background:linear-gradient(180deg,#f8fbfd,#eef5f8);
      transition:opacity .25s ease,visibility .25s ease
    }

    #loading.hide{
      opacity:0;
      visibility:hidden;
      pointer-events:none
    }

    .box{
      text-align:center;
      color:#173b50
    }

    .logo{
      width:58px;
      height:58px;
      margin:0 auto 12px;
      border-radius:17px;
      display:grid;
      place-items:center;
      background:linear-gradient(145deg,#002b49,#0b6d9c);
      color:#fff;
      font-size:24px;
      font-weight:800;
      box-shadow:0 14px 34px rgba(0,43,73,.18)
    }

    .box b{
      display:block;
      font-size:20px
    }

    .box span{
      display:block;
      margin-top:6px;
      font-size:12px;
      color:#718692
    }

    .bar{
      width:190px;
      height:6px;
      margin:18px auto 0;
      background:#dfeaf0;
      border-radius:999px;
      overflow:hidden
    }

    .bar i{
      display:block;
      width:40%;
      height:100%;
      background:linear-gradient(90deg,#0b5f97,#20a6a0,#0b5f97);
      animation:m 1.2s ease-in-out infinite
    }

    @keyframes m{
      from{transform:translateX(-120%)}
      to{transform:translateX(350%)}
    }
  
    #installPwa{
      position:fixed;right:16px;bottom:16px;z-index:30;
      display:none;align-items:center;gap:9px;border:0;border-radius:13px;
      background:#002b49;color:#fff;padding:12px 15px;font-weight:700;
      box-shadow:0 10px 26px rgba(0,43,73,.22);cursor:pointer
    }
    #installPwa.show{display:flex}
    #offlineNotice{
      position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
      z-index:40;display:none;background:#8a2a21;color:#fff;
      padding:10px 14px;border-radius:11px;font-size:12px;font-weight:700
    }
    #offlineNotice.show{display:block}

  </style>
</head>
<body>

  <div id="loading">
    <div class="box">
      <div class="logo">İSG</div>
      <b>İSG Saha Gözlem Portalı</b>
      <span>Portal yükleniyor...</span>
      <div class="bar"><i></i></div>
    </div>
  </div>

  <button id="installPwa" type="button">＋ Uygulamayı Yükle</button>
  <div id="offlineNotice">İnternet bağlantısı yok. Portal verileri için bağlantı gereklidir.</div>

  <iframe
    id="appFrame"
    title="TUI BLUE Palm Garden İSG Saha Gözlem Portalı"
    allow="camera; microphone; clipboard-read; clipboard-write; fullscreen"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>

  <script>
    const ISG_APP_URL =
      'https://script.google.com/macros/s/AKfycbzQxTO7uzoIeQhbOAr4cKJ3Sb9mhnOVkzRkWmCY9_BEJQCKe7cQQ9jwVFeqF-tSmjs0AQ/exec';

    function makeTarget(){
      const p=new URLSearchParams(window.location.search);
      p.set('embedded','1');
      return ISG_APP_URL + '?' + p.toString();
    }

    const frame=document.getElementById('appFrame');
    const loading=document.getElementById('loading');

    frame.src=makeTarget();

    // Düzeltici Faaliyet portalındaki mantık:
    // GitHub giriş üretmez; gerçek Apps Script ekranını açar.
    frame.addEventListener('load',()=>{
      setTimeout(()=>loading.classList.add('hide'),450);
    });

    window.addEventListener('message',event=>{
      const data=event.data||{};
      if(
        data.type==='TBPG_LOGIN_READY' ||
        data.type==='TBPG_PORTAL_READY' ||
        data.portal==='ISG'
      ){
        loading.classList.add('hide');
      }
    });

    // Google tarafı postMessage göndermese bile beyaz bekleme ekranında kalmasın.
    setTimeout(()=>loading.classList.add('hide'),12000);
  </script>

  <script>
    let deferredInstallPrompt=null;
    const installBtn=document.getElementById('installPwa');
    const offlineNotice=document.getElementById('offlineNotice');

    window.addEventListener('beforeinstallprompt',e=>{
      e.preventDefault();
      deferredInstallPrompt=e;
      installBtn.classList.add('show');
    });

    installBtn.addEventListener('click',async()=>{
      if(!deferredInstallPrompt)return;
      deferredInstallPrompt.prompt();
      try{await deferredInstallPrompt.userChoice}catch(e){}
      deferredInstallPrompt=null;
      installBtn.classList.remove('show');
    });

    window.addEventListener('appinstalled',()=>{
      deferredInstallPrompt=null;
      installBtn.classList.remove('show');
    });

    function updateNetworkState(){
      offlineNotice.classList.toggle('show',!navigator.onLine);
    }
    window.addEventListener('online',updateNetworkState);
    window.addEventListener('offline',updateNetworkState);
    updateNetworkState();

    if('serviceWorker' in navigator){
      window.addEventListener('load',()=>{
        navigator.serviceWorker.register('./service-worker.js',{scope:'./'})
          .catch(()=>{});
      });
    }
  </script>

</body>
</html>
