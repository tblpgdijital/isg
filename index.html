<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#002b49">
  <meta name="description" content="TUI BLUE Palm Garden İSG Saha Gözlem Portalı">
  <title>İSG Saha Gözlem Portalı</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fa;font-family:Arial,Helvetica,sans-serif}
    #appFrame{position:fixed;inset:0;width:100%;height:100dvh;border:0;background:#fff;visibility:hidden;opacity:0;transition:opacity .28s ease}
    #appFrame.ready{visibility:visible;opacity:1}
    #entrySplash{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#ffffff 0,#f5f8fb 42%,#edf3f7 100%);transition:opacity .28s ease,visibility .28s ease}
    #entrySplash.hide{opacity:0;visibility:hidden;pointer-events:none}
    .splashCard{width:min(410px,calc(100vw - 30px));padding:30px 24px 26px;border-radius:24px;background:rgba(255,255,255,.92);border:1px solid #dbe6ee;box-shadow:0 24px 70px rgba(0,43,73,.16);text-align:center}
    .orb{position:relative;width:170px;height:170px;margin:0 auto 14px;display:grid;place-items:center}
    .ring,.ring2{position:absolute;border-radius:50%;inset:8px;border:1.5px solid rgba(0,77,128,.15)}
    .ring{animation:spin 6s linear infinite}.ring2{inset:25px;border-style:dashed;border-color:rgba(0,77,128,.24);animation:spinBack 8s linear infinite}
    .dot{position:absolute;width:10px;height:10px;border-radius:50%;background:#00659f;box-shadow:0 5px 12px rgba(0,77,128,.25);animation:pulse 2.2s ease-in-out infinite}
    .d1{top:9px;left:80px}.d2{right:17px;top:42px;animation-delay:.3s}.d3{right:24px;bottom:28px;animation-delay:.6s}.d4{left:24px;bottom:28px;animation-delay:.9s}.d5{left:17px;top:42px;animation-delay:1.2s}
    .logoCore{position:relative;width:106px;height:106px;border-radius:30px;background:linear-gradient(180deg,#fff,#eaf4fb);display:grid;place-items:center;overflow:hidden;box-shadow:0 18px 34px rgba(0,77,128,.18);animation:float 2.4s ease-in-out infinite}
    .logoCore:after{content:"";position:absolute;inset:-45% -20%;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.9) 50%,transparent 60%);animation:shine 2.7s ease-in-out infinite}
    .logoCrop{width:235px;max-width:none;transform:translateX(59px);position:relative;z-index:1}
    .isgText{margin-top:6px;font-size:26px;font-weight:800;letter-spacing:.14em;color:#003b62}
    .sub{margin-top:7px;color:#6e8190;font-size:13px}.progress{width:min(270px,100%);height:8px;margin:20px auto 0;border-radius:999px;background:#e4edf3;overflow:hidden}.progress span{display:block;width:38%;height:100%;border-radius:999px;background:linear-gradient(90deg,#00659f,#33a2d5,#00659f);animation:slide 1.4s ease-in-out infinite}
    @keyframes spin{to{transform:rotate(360deg)}}@keyframes spinBack{to{transform:rotate(-360deg)}}@keyframes pulse{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.18)}}@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-5px) scale(1.035)}}@keyframes shine{0%,30%{transform:translateX(-90%)}65%,100%{transform:translateX(90%)}}@keyframes slide{0%{transform:translateX(-130%)}100%{transform:translateX(330%)}}
    @media(max-width:600px){.splashCard{padding:24px 18px}.orb{width:150px;height:150px}.logoCore{width:96px;height:96px}.logoCrop{width:215px;transform:translateX(54px)}.isgText{font-size:22px}}
  </style>
</head>
<body>
  <div id="entrySplash" aria-live="polite">
    <div class="splashCard">
      <div class="orb" aria-hidden="true">
        <div class="ring"></div><div class="ring2"></div>
        <span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span><span class="dot d4"></span><span class="dot d5"></span>
        <div class="logoCore"><img class="logoCrop" src="https://lh3.googleusercontent.com/d/1ZJjPfKE8uAmYkeDD-67gKwH3WQfJ_tXW" alt=""></div>
      </div>
      <div class="isgText">İSG</div>
      <div class="sub">TUI BLUE Palm Garden · Saha Gözlem Portalı hazırlanıyor</div>
      <div class="progress"><span></span></div>
    </div>
  </div>
  <iframe id="appFrame" title="TUI BLUE Palm Garden İSG Saha Gözlem Portalı" allow="camera; microphone; clipboard-read; clipboard-write; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script>
    const ISG_APP_URL='https://script.google.com/macros/s/AKfycbzQxTO7uzoIeQhbOAr4cKJ3Sb9mhnOVkzRkWmCY9_BEJQCKe7cQQ9jwVFeqF-tSmjs0AQ/exec';
    const frame=document.getElementById('appFrame');
    const splash=document.getElementById('entrySplash');
    let revealed=false;
    function makeTarget(){const p=new URLSearchParams(location.search);p.set('embedded','1');return ISG_APP_URL+(ISG_APP_URL.includes('?')?'&':'?')+p.toString()}
    function reveal(){if(revealed)return;revealed=true;frame.classList.add('ready');splash.classList.add('hide')}
    window.addEventListener('message',e=>{const d=e.data||{};if(d.portal==='ISG'&&(d.type==='TBPG_LOGIN_READY'||d.type==='TBPG_PORTAL_READY'))reveal()});
    frame.addEventListener('load',()=>{setTimeout(reveal,1500)});
    frame.src=makeTarget();
  </script>
</body>
</html>
