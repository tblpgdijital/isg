<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#002b49">
  <meta name="description" content="TUI BLUE Palm Garden İSG Saha Gözlem Portalı">
  <title>İSG Saha Gözlem Portalı</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fa;font-family:Arial,Helvetica,sans-serif}
    #appFrame{position:fixed;inset:0;width:100%;height:100dvh;border:0;background:#fff;visibility:hidden;opacity:0;transition:opacity .28s ease}
    #appFrame.ready{visibility:visible;opacity:1}
    #entrySplash{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#ffffff 0,#f5f8fb 42%,#edf3f7 100%);transition:opacity .28s ease,visibility .28s ease}
    #entrySplash.hide{opacity:0;visibility:hidden;pointer-events:none}
    .splashCard{width:min(430px,calc(100vw - 30px));padding:30px 24px 26px;border-radius:24px;background:rgba(255,255,255,.92);border:1px solid #dbe6ee;box-shadow:0 24px 70px rgba(0,43,73,.16);text-align:center}
    .orb{position:relative;width:185px;height:185px;margin:0 auto 14px;display:grid;place-items:center}
    .ring,.ring2{position:absolute;border-radius:50%;border:1.5px solid rgba(0,77,128,.14)}
    .ring{inset:8px;animation:spin 7s linear infinite}
    .ring2{inset:28px;border-style:dashed;border-color:rgba(0,77,128,.24);animation:spinBack 9s linear infinite}
    .dot{position:absolute;width:12px;height:12px;border-radius:50%;background:#0b7dbf;box-shadow:0 5px 12px rgba(0,77,128,.25);animation:pulse 2.2s ease-in-out infinite}
    .d1{top:8px;left:86px} .d2{right:16px;top:44px;animation-delay:.3s} .d3{right:24px;bottom:30px;animation-delay:.6s} .d4{left:24px;bottom:30px;animation-delay:.9s} .d5{left:16px;top:44px;animation-delay:1.2s}
    .figureCore{position:relative;width:120px;height:120px;border-radius:34px;background:linear-gradient(180deg,#fff,#eaf4fb);display:grid;place-items:center;overflow:hidden;box-shadow:0 18px 34px rgba(0,77,128,.18);animation:float 2.4s ease-in-out infinite}
    .figureCore:after{content:"";position:absolute;inset:-45% -20%;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.9) 50%,transparent 60%);animation:shine 2.7s ease-in-out infinite}
    .figureCore img{position:relative;z-index:1;width:92px;height:92px;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.08))}
    .isgText{margin-top:6px;font-size:26px;font-weight:800;letter-spacing:.14em;color:#003b62}
    .sub{margin-top:7px;color:#6e8190;font-size:13px}
    .progress{width:min(270px,100%);height:8px;margin:20px auto 0;border-radius:999px;background:#e4edf3;overflow:hidden}
    .progress span{display:block;width:38%;height:100%;border-radius:999px;background:linear-gradient(90deg,#00659f,#33a2d5,#00659f);animation:slide 1.4s ease-in-out infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes spinBack{to{transform:rotate(-360deg)}}
    @keyframes pulse{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.18)}}
    @keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-5px) scale(1.035)}}
    @keyframes shine{0%,30%{transform:translateX(-90%)}65%,100%{transform:translateX(90%)}}
    @keyframes slide{0%{transform:translateX(-130%)}100%{transform:translateX(330%)}}
    @media(max-width:600px){.splashCard{padding:24px 18px}.orb{width:160px;height:160px}.figureCore{width:106px;height:106px}.figureCore img{width:82px;height:82px}.isgText{font-size:22px}}
  </style>
</head>
